name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Check out the post-merge state on PRs so CI validates what will land on main.
env:
  CHECKOUT_REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}

jobs:
  core-tests:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
          lfs: false   # the tests need no binary assets

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: dotnet test (Assets/Purr3D/Core, no Unity)
        run: dotnet --version && dotnet test tests/Purr3D.Core.Tests/Purr3D.Core.Tests.csproj --logger "console;verbosity=normal"
